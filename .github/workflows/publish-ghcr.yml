name: Publish GHCR CUDA images

on:
  workflow_dispatch:
    inputs:
      tag_prefix:
        description: Image tag prefix
        required: true
        default: pr-3
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    name: Build and push image
    runs-on:
      - self-hosted
      - linux
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: CUDA 13
            tag: cu13
            cuda_version: 13.0.3
            flashinfer_version: 0.6.18.post1
            build_base_image: pytorch/manylinux2_28-builder:cuda13.0-78e737ad29420ffc4800e677c51e2a852caf8359
            final_base_image: nvidia/cuda:13.0.3-base-ubuntu24.04
          - name: CUDA 12.8
            tag: cu12.8
            cuda_version: 12.8.1
            flashinfer_version: 0.6.9
            build_base_image: pytorch/manylinux2_28-builder:cuda12.8
            final_base_image: nvidia/cuda:12.8.1-base-ubuntu24.04

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: vllm-openai
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/vllm:${{ inputs.tag_prefix }}-${{ matrix.tag }}
            ghcr.io/${{ github.repository_owner }}/vllm:${{ inputs.tag_prefix }}-${{ matrix.tag }}-${{ github.sha }}
          build-args: |
            CUDA_VERSION=${{ matrix.cuda_version }}
            FLASHINFER_VERSION=${{ matrix.flashinfer_version }}
            BUILD_BASE_IMAGE=${{ matrix.build_base_image }}
            FINAL_BASE_IMAGE=${{ matrix.final_base_image }}
            VLLM_BUILD_COMMIT=${{ github.sha }}
            VLLM_BUILD_PIPELINE=github-actions-ghcr
            VLLM_IMAGE_TAG=ghcr.io/${{ github.repository_owner }}/vllm:${{ inputs.tag_prefix }}-${{ matrix.tag }}
            max_jobs=2
            nvcc_threads=8
          cache-from: type=gha,scope=vllm-${{ matrix.tag }}
          cache-to: type=gha,mode=max,scope=vllm-${{ matrix.tag }}
          provenance: false
          sbom: false
